# Golden set of the search accuracy benchmark. See README.md.
#
# Each query names the passage(s) that answer it, on a page of the corpus pinned
# in corpus.yaml. Grade 3 answers the query directly, 2 answers part of it, and
# 1 is useful context. Passages are matched word by word, ignoring case,
# punctuation and Markdown syntax.
#
# The passages quote the documentation of these projects, with Markdown
# formatting removed:
#   react.dev (https://github.com/reactjs/react.dev), CC BY 4.0
#     (https://creativecommons.org/licenses/by/4.0/)
#   FastAPI (https://github.com/fastapi/fastapi), MIT License
#   Vite (https://github.com/vitejs/vite), MIT License
#   Pydantic (https://github.com/pydantic/pydantic), MIT License

status: draft
