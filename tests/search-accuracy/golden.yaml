        text: BaseSettings, the base object for Pydantic settings management, has been moved to a separate
          package, pydantic-settings.
      - page: concepts/pydantic_settings.md
        grade: 2
        text: Pydantic Settings provides optional Pydantic features for loading a settings or config class
          from environment variables or secrets files.
  - id: pydantic-023
    library: pydantic
    query: validation error location nested model
    intent: api-lookup
    style: keywords
    passages:
