    intent: troubleshooting
    style: agent-request
    passages:
      - page: errors/usage_errors.md
        grade: 3
        text: This error is raised when a type referenced in an annotation of a pydantic-validated type
          (such as a subclass of BaseModel, or a pydantic dataclass) is not defined
      - page: concepts/models.md
        grade: 2
        text: Pydantic tries to determine when this is necessary automatically and error if it wasn't done,
          but you may want to call model_rebuild() proactively when dealing with recursive models or
          generics.
  - id: pydantic-025
