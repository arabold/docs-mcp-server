  - id: pydantic-026
    library: pydantic
    query: Instance is frozen error pydantic
    intent: troubleshooting
    style: keywords
    passages:
      - page: errors/validation_errors.md
        grade: 3
        text: This error is raised when frozen is set in the configuration and you attempt to delete or
