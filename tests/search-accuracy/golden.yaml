        grade: 3
        text: The first item in the loc list will be the field where the error occurred, and if the field is
          a sub-model, subsequent items will be present to indicate the nested location of the
          error.
  - id: pydantic-024
    library: pydantic
    query: While importing our models module the app crashes with a PydanticUserError saying the Order
