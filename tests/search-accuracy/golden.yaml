      - page: concepts/models.md
        grade: 2
        text: Models can be configured to be immutable via model_config['frozen'] = True. When this is set,
          attempting to change the values of instance attributes will raise errors.
  - id: pydantic-027
    library: pydantic
    query: my Field pattern uses a lookahead and fails; can I use Python's re module instead?
    intent: troubleshooting
    style: question
    passages:
      - page: api/standard_library_types.md
        grade: 3
        text: By default, Pydantic will use the regex Rust crate to enforce the pattern constraint. The
          regex engine can be controlled using the regex_engine configuration value.
      - page: migration.md
