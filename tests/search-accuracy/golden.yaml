    library: pydantic
    query: TypeAdapter.dump_json vs model_dump_json return type
    intent: comparison
    style: identifier
    passages:
      - page: concepts/type_adapter.md
        grade: 3
        text: TypeAdapter's dump_json methods returns a bytes object, unlike the corresponding method for
          BaseModel, model_dump_json, which returns a str.
  - id: pydantic-015
    library: pydantic
    query: "Profiling a Flask endpoint shows most of the time goes into pydantic: the handler calls
      TypeAdapter(list[Order]).validate_python(payload) on every request. What is the recommended
      way to structure this so the adapter is not rebuilt per call?"
    intent: how-to
    style: agent-request
    passages:
      - page: concepts/performance.md
        grade: 3
        text: If you're using a TypeAdapter in a function, it will be instantiated each time the function is
          called. Instead, instantiate it once, and reuse it.
      - page: concepts/type_adapter.md
        grade: 2
        text: This comes with some non-trivial overhead, so it is recommended to create a TypeAdapter for a
          given type just once and reuse it in loops or other performance-critical code.
  - id: pydantic-016
    library: pydantic
    query: union smart mode vs left_to_right
    intent: comparison
    style: keywords
    passages:
      - page: concepts/unions.md
        grade: 3
        text: smart mode - similar to "left to right mode" members are tried in order; however, validation
          will proceed past the first match to attempt to find a better match, this is the default
          mode for most union validation
      - page: concepts/unions.md
        grade: 2
        text: With this approach, validation is attempted against each member of the union in their order
          they're defined, and the first successful validation is accepted as input.
  - id: pydantic-017
    library: pydantic
    query: what's the point of tagging union members with a discriminator?
    intent: conceptual
    style: question
    passages:
      - page: concepts/unions.md
        grade: 3
        text: Unions can be validated more efficiently using a discriminator, by specifically choosing which
          member of the union to validate against. This makes validation more efficient and also
          avoids a proliferation of errors when validation fails.
      - page: concepts/performance.md
        grade: 2
        text: Tagged union (or discriminated union) is a union with a field that indicates which type it is.
  - id: pydantic-018
    library: pydantic
    query: We're refactoring a codebase full of stdlib @dataclass types and want runtime type checking
      on them. Should I convert them to BaseModel subclasses or apply pydantic's dataclass
      decorator, and what would I give up with the decorator route?
    intent: comparison
    style: agent-request
    passages:
      - page: concepts/dataclasses.md
        grade: 3
        text: Keep in mind that Pydantic dataclasses are not a replacement for Pydantic models. They provide
          a similar functionality to stdlib dataclasses with the addition of Pydantic validation.
      - page: concepts/dataclasses.md
        grade: 2
        text: The various methods to validate, dump and generate a JSON Schema aren't available. Instead,
          you can wrap the dataclass with a TypeAdapter and make use of its methods
  - id: pydantic-019
    library: pydantic
    query: I'm ingesting a list of sensor readings where a few entries are malformed. Right now one bad
      entry makes the whole list fail; I'd like pydantic to quietly drop the broken entries and keep
      the good ones. Which type wrapper does this?
    intent: how-to
    style: agent-request
    passages:
      - page: concepts/types.md
        grade: 3
        text: "The OnErrorOmit annotation changes this behavior: any item failing validation is silently
          omitted from the result, and the valid ones are kept."
  - id: pydantic-020
    library: pydantic
    query: does validate_call also check what the function returns?
    intent: api-lookup
    style: question
    passages:
      - page: concepts/validation_decorator.md
        grade: 3
        text: By default, the return value of the function is not validated. To do so, the validate_return
          argument of the decorator can be set to True.
  - id: pydantic-021
    library: pydantic
    query: if I annotate a field as Optional[str] with no default, must callers still pass it?
    intent: conceptual
    style: question
    passages:
      - page: migration.md
        grade: 3
        text: A field annotated as typing.Optional[T] will be required, and will allow for a value of None.
          It does not mean that the field has a default value of None.
      - page: concepts/fields.md
        grade: 2
        text: a type annotated as Any or wrapped by Optional would be given an implicit default of None even
          if no default was explicitly specified. This is no longer the case in Pydantic V2.
  - id: pydantic-022
    library: pydantic
    query: ImportError BaseSettings pydantic 2
    intent: troubleshooting
    style: keywords
    passages:
