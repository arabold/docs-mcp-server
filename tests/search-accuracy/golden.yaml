  - id: pydantic-029
    library: pydantic
    query: pydantic automatic type coercion
    intent: conceptual
    style: keywords
    passages:
      - page: concepts/strict_mode.md
        grade: 3
        text: By default, Pydantic will attempt to coerce values to the desired type when possible. For
          example, you can pass the string '123' as the input for the int number type, and it will
          be converted to the value 123.
      - page: concepts/models.md
