name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x" # Match engines requirement in package.json
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type checker
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint # Run after linting passes
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --no-shell --with-deps chromium

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test # Run after tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  docker-test:
    name: Docker image E2E
    runs-on: ubuntu-latest
    needs: build # Only run once unit tests + build pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: docs-mcp-server:e2e-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker E2E tests
        env:
          # Reuse the image built above instead of rebuilding inside the test.
          DOCKER_IMAGE_TAG: docs-mcp-server:e2e-test
        run: npm run test:docker

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Lint and render Helm chart
        run: |
          chart=deployment/helm/docs-mcp-server
          helm lint "$chart"
          helm lint "$chart" -f "$chart/ci/ephemeral-values.yaml"
          helm lint "$chart" -f "$chart/ci/existing-claims-values.yaml"
          helm lint "$chart" -f "$chart/ci/exposure-values.yaml"
          helm template default "$chart" >/dev/null
          helm template ephemeral "$chart" -f "$chart/ci/ephemeral-values.yaml" >/dev/null
          existing="$(helm template existing "$chart" -f "$chart/ci/existing-claims-values.yaml")"
          ! grep -q 'kind: PersistentVolumeClaim' <<<"$existing"
          grep -q 'claimName: existing-data' <<<"$existing"
          grep -q 'claimName: existing-config' <<<"$existing"
          exposure="$(helm template exposure "$chart" -f "$chart/ci/exposure-values.yaml")"
          grep -q 'kind: Ingress' <<<"$exposure"
          grep -q 'kind: Route' <<<"$exposure"
          grep -q "name: 'exposure-docs-mcp-server-extra'" <<<"$exposure"
          grep -q "release: 'exposure'" <<<"$exposure"

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          version: v0.27.0
          cluster_name: docs-mcp-e2e

      - name: Install and test Helm release
        run: |
          kind load docker-image docs-mcp-server:e2e-test --name docs-mcp-e2e
          helm upgrade --install docs-mcp deployment/helm/docs-mcp-server \
            --namespace docs-mcp --create-namespace \
            -f deployment/helm/docs-mcp-server/ci/ephemeral-values.yaml \
            --set image.repository=docs-mcp-server \
            --set image.tag=e2e-test \
            --set image.pullPolicy=Never \
            --wait --timeout 5m
          kubectl rollout status deployment/docs-mcp-docs-mcp-server \
            --namespace docs-mcp --timeout=2m
          helm test docs-mcp --namespace docs-mcp --timeout 2m

      - name: Collect Helm failure diagnostics
        if: failure()
        run: |
          kubectl get all,pvc --namespace docs-mcp -o wide || true
          kubectl describe pods --namespace docs-mcp || true
          kubectl logs --namespace docs-mcp \
            --selector app.kubernetes.io/instance=docs-mcp \
            --all-containers --tail=-1 || true
