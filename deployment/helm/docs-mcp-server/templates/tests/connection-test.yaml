apiVersion: v1
kind: Pod
metadata:
  name: {{ include "docs-mcp-server.fullname" . }}-test-connection
  labels:
    {{- include "docs-mcp-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 60
  serviceAccountName: {{ include "docs-mcp-server.serviceAccountName" . }}
  automountServiceAccountToken: false
  securityContext:
    {{- include "docs-mcp-server.podSecurityContext" . | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: connection
      image: {{ include "docs-mcp-server.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      env:
        - { name: HOME, value: /app/.runtime }
        - { name: XDG_CACHE_HOME, value: /app/.runtime/cache }
      volumeMounts:
        - { name: tmp, mountPath: /tmp }
        - { name: runtime, mountPath: /app/.runtime }
      command: ["node"]
      args:
        - "-e"
        - >-
          fetch('http://{{ include "docs-mcp-server.fullname" . }}:{{ .Values.service.port }}/', { signal: AbortSignal.timeout(10000) })
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
  volumes:
    - name: tmp
      emptyDir: {}
    - name: runtime
      emptyDir: {}
